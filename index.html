<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <!-- Para filtros y navegacion -->
       <input type="search"  id="Buscar" placeholder="Filtrar Por Provincia, Categoría o Comida">
       <select id="filtrocategoria">
       </select>
       <select id="filtroprovincia">
       </select>
    
    </header>

    <main class="comida-container" id="comidaContainer">

    </main>     

    <section class="addFood">
      <!-- Para el form para agregar comida -->
       <form id="agregarcomida">
        <section class="inputs">
          <label for="nombre">Nombre de la comida</label>
          <input type="text" id="nombre" placeholder="Nombre de la Comida">
          
          <label for="categoria">Categoría</label>
          <input type="text" id="categoria" placeholder="Categoría">
          <label for="provincia">Provincia</label>
          <input type="text" id="provincia" placeholder="Provincia">
          <label for="ingredientes">Ingredientes</label>
          <input type="text" id="ingredientes"class="ingrediente" placeholder="Ingredientes">
        </section>
        <section class="botones">
          <button type="button" id="agregarIngredientes">Agregar Ingredientes</button>
          <button type="submit">Agregar la comida</button>
        </section>
       </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
